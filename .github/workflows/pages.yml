name: Deploy deck and prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir demo/reaction-picker-prototype install --frozen-lockfile
      - name: Build deck
        run: pnpm build --base /slides-agentic-project-manager/
      - name: Build prototype
        env:
          VITE_GIF_API_KEY: ${{ secrets.VITE_GIF_API_KEY }}
        run: |
          pnpm --dir demo/reaction-picker-prototype exec tsc --noEmit
          pnpm --dir demo/reaction-picker-prototype exec vite build --base /slides-agentic-project-manager/demo/reaction-picker/
          mkdir -p dist/demo/reaction-picker
          cp -R demo/reaction-picker-prototype/dist/. dist/demo/reaction-picker/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
